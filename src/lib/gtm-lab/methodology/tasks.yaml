# Catálogo de tareas de ejecución, v1. Redacción propia (decisiones 0002 y 0003).
# La estructura (etapas, categorías, tipos) sigue el mapa de la checklist de referencia; los textos son nuestros.
# Campos de cada tarea (SDD tablero-ejecucion):
#   step:   la tarea se hace en ese paso de estrategia; su estado sale del entregable.
#   needs:  entregables que conviene tener antes. Solo es un aviso, nunca bloquea.
#   postin: la tarea trata de escribir o publicar en LinkedIn y se hace con Postin.
#   duration: orientativa. Valores: hour, hours, day, days, weeks, month, ongoing.

categories:
  - { id: foundation, title: "Base de la estrategia" }
  - { id: research, title: "Investigación" }
  - { id: validation, title: "Validación con clientes" }
  - { id: product, title: "Producto" }
  - { id: pricing, title: "Precio y modelo de negocio" }
  - { id: positioning, title: "Posicionamiento y mensaje" }
  - { id: materials, title: "Materiales" }
  - { id: channels, title: "Canales y comunicación" }
  - { id: launch, title: "Lanzamiento" }
  - { id: system, title: "Sistema de trabajo" }
  - { id: marketing, title: "Marketing" }
  - { id: sales, title: "Ventas" }

tasks:
  # Base de la estrategia
  - { id: foundation-goal, title: "Concreta adónde quieres llegar y para cuándo", summary: "Escribe qué quieres conseguir, en qué plazo y por qué te importa. Al terminar tienes el objetivo que ordena el resto de decisiones.", stage: before, category: foundation, kind: workshop, duration: hours, step: end-goal }
  - { id: foundation-one-sheet, title: "Resume tu estrategia en una sola hoja", summary: "Reúne en una hoja el producto, el cliente, la ventaja y el objetivo a corto plazo. Al terminar tienes una versión que cualquiera entiende en dos minutos.", stage: before, category: foundation, kind: workshop, duration: hour, needs: [entry-segment, core-message] }
  - { id: foundation-swot, title: "Haz un diagnóstico DAFO de tu situación", summary: "Ordena fortalezas, debilidades, oportunidades y amenazas con lo que ya sabes del mercado. Al terminar sabes en qué apoyarte y qué vigilar.", stage: before, category: foundation, kind: workshop, duration: hours, needs: [competitor-map] }
  - { id: foundation-problem-space, title: "Ordena los problemas de tu cliente por temas", summary: "Agrupa los problemas que cuenta tu cliente y marca los que le quitan el sueño. Al terminar tienes un mapa del problema que sirve para tu mensaje.", stage: before, category: foundation, kind: workshop, duration: hours, needs: [project-profile] }
  - { id: foundation-value-jobs, title: "Escribe tu promesa de valor a partir del problema que el cliente quiere resolver", summary: "Describe para quién es, qué problema resuelve, cómo lo resuelves y qué resultado obtiene, y de ahí saca la promesa. Al terminar tu propuesta de valor responde a algo real.", stage: before, category: foundation, kind: workshop, duration: hours, step: value }
  - { id: foundation-linkedin-profile, title: "Deja tu perfil de LinkedIn listo para generar confianza", summary: "Revisa foto, titular, resumen y destacados para que quien te visite entienda a quién ayudas. Al terminar tu perfil respalda lo que dices en tus mensajes.", stage: before, category: foundation, kind: quick, duration: hours }
  - { id: foundation-email-capture, title: "Decide dónde captarás correos desde el primer día", summary: "Elige la herramienta y el lugar donde pedirás el correo a quien muestre interés. Al terminar nadie interesado se pierde.", stage: before, category: foundation, kind: decision, duration: hours }
  - { id: foundation-handles, title: "Asegura tu nombre en la web y en las redes", summary: "Compra los dominios y registra tu nombre en las redes que vayas a usar, aunque aún no las actives. Al terminar tu nombre es tuyo en todos los sitios.", stage: before, category: foundation, kind: decision, duration: day }
  - { id: foundation-plan-90, title: "Convierte la estrategia en un plan trimestral", summary: "Fija los objetivos del trimestre, reparte las acciones y decide cómo revisarlas. Al terminar sabes qué haces cada semana.", stage: before, category: foundation, kind: framework, duration: hours, step: plan-review }
  - { id: foundation-analytics, title: "Mide las visitas de tu primera página desde el primer día", summary: "Instala analítica y, si harás publicidad, los píxeles. Al terminar sabes de dónde llega cada visita.", stage: before, category: foundation, kind: quick, duration: hours }
  - { id: foundation-quarter-focus, title: "Elige la apuesta que protegerás este trimestre", summary: "Decide la única cosa que, si no sale, hace que el trimestre no cuente, y úsala para decir que no a lo demás. Al terminar tu equipo sabe qué se protege primero.", stage: before, category: foundation, kind: habit, duration: hours, needs: [north-metric] }

  # Investigación
  - { id: research-segments, title: "Lista los segmentos donde podrías empezar", summary: "Anota los tipos de cliente que podrían sacar partido de tu producto y qué problema tiene cada uno. Al terminar tienes candidatos entre los que elegir.", stage: before, category: research, kind: framework, duration: hours, step: segments }
  - { id: research-entry-segment, title: "Puntúa los candidatos y quédate con un segmento de entrada", summary: "Compara los segmentos con criterios claros y elige el primero que vas a trabajar. Al terminar sabes a quién te diriges primero y qué dejas para después.", stage: before, category: research, kind: workshop, duration: weeks, step: entry-segment }
  - { id: research-validation-methods, title: "Elige cómo vas a validar tus supuestos", summary: "Escoge los métodos de validación que mejor encajan con tu fase y tu cliente. Al terminar tienes pruebas concretas, cada una con la señal que la confirma.", stage: before, category: research, kind: framework, duration: hour, step: validation-plan }
  - { id: research-interviews, title: "Haz una ronda de entrevistas con posibles clientes", summary: "Prepara el guion, agenda las conversaciones y apunta lo que aprendes sin vender. Al terminar tienes citas literales y patrones, no opiniones.", stage: before, category: research, kind: guide, duration: weeks, needs: [experiments] }
  - { id: research-survey, title: "Lanza una encuesta de descubrimiento", summary: "Pregunta a una muestra de tu segmento cómo resuelve hoy el problema. Al terminar tienes datos para contrastar lo que oyes en las entrevistas.", stage: before, category: research, kind: guide, duration: days, needs: [entry-segment] }
  - { id: research-competitors, title: "Compara a tus alternativas una por una", summary: "Anota qué hace bien y mal cada alternativa y cómo la ve tu cliente. Al terminar sabes dónde puedes ser distinto.", stage: before, category: research, kind: framework, duration: weeks, step: competitors }
  - { id: research-swipe, title: "Guarda ejemplos de lo que hace tu competencia", summary: "Reúne en un solo sitio capturas de sus webs, mensajes y materiales. Al terminar tienes un archivo para inspirarte y para no repetir lo que ya hacen.", stage: before, category: research, kind: habit, duration: ongoing, needs: [competitor-map] }
  - { id: research-monitor, title: "Sigue lo que anuncian y escriben tus competidores", summary: "Suscríbete a sus correos y revisa sus anuncios con regularidad para ver qué dicen y qué prueban. Al terminar sabes cuándo cambian de rumbo.", stage: before, category: research, kind: habit, duration: days }
  - { id: research-insider, title: "Vive el proceso de compra de un competidor o pregunta a alguien que lo conoce por dentro", summary: "Compra o prueba su producto como lo haría un cliente, o conversa con alguien que lo conozca por dentro. Al terminar tienes información que no sale en su web.", stage: before, category: research, kind: quick, duration: hours }

  # Validación con clientes
  - { id: validation-assumptions, title: "Mapea tus supuestos y prioriza los de más riesgo", summary: "Lista lo que das por cierto y ordénalo por importancia y por falta de pruebas. Al terminar sabes qué comprobar primero.", stage: before, category: validation, kind: workshop, duration: hours, step: assumptions }
  - { id: validation-minimal-test, title: "Lanza una prueba mínima de la idea antes de construir", summary: "Monta una página, un contenido o un mini producto que mida el interés real. Al terminar tienes una señal sin haber construido el producto.", stage: before, category: validation, kind: framework, duration: day, needs: [assumption-map] }
  - { id: validation-alpha, title: "Consigue un primer grupo que pruebe la versión alfa", summary: "Invita a un grupo reducido de personas del perfil a usar el producto y a contarte qué les pasa. Al terminar tienes fallos y reacciones de uso real.", stage: before, category: validation, kind: guide, duration: hours, needs: [customer-profile] }
  - { id: validation-beta-invite, title: "Invita a comunidades relevantes a tu beta o a tu demo", summary: "Elige comunidades donde está tu cliente y publica una invitación honesta. Al terminar tienes una lista de interesados.", stage: before, category: validation, kind: guide, duration: hours }
  - { id: validation-customer-profile, title: "Describe a tu cliente inicial con lo que has aprendido", summary: "Usa tus experimentos y entrevistas para describir quién es, qué le duele y qué le hace buscar una solución. Al terminar tu perfil se apoya en evidencia.", stage: before, category: validation, kind: framework, duration: hours, step: customer-profile }
  - { id: validation-buying-group, title: "Identifica quién interviene en la decisión de compra", summary: "Anota quién inicia, quién influye, quién decide y quién paga en las empresas de tu segmento. Al terminar sabes a quién hablar en cada caso.", stage: before, category: validation, kind: framework, duration: days, step: buying-group }

  # Producto
  - { id: product-roadmap, title: "Ordena en el tiempo lo que vas a construir, aunque solo tengas fechas aproximadas", summary: "Ordena lo que vas a construir y cuándo, con hitos que dependan de lo que aprendas. Al terminar el equipo sabe qué viene primero.", stage: before, category: product, kind: framework, duration: days }
  - { id: product-ownership, title: "Reparte responsabilidades y elige cómo trabajará el equipo", summary: "Decide quién es responsable de qué, qué herramientas se comparten y cómo se coordina el equipo. Al terminar nadie duda a quién preguntar.", stage: before, category: product, kind: decision, duration: hours }
  - { id: product-mvp, title: "Construye el producto mínimo que puedas enseñar", summary: "Define lo mínimo que resuelve el problema principal y constrúyelo. Al terminar tienes algo que un cliente puede usar.", stage: before, category: product, kind: framework, duration: month, needs: [value-proposition] }
  - { id: product-journey-metrics, title: "Decide qué medirás en cada etapa del recorrido del cliente", summary: "Asocia una métrica a cada etapa, desde que te conoce hasta que paga y se queda. Al terminar sabes dónde se pierde la gente.", stage: before, category: product, kind: framework, duration: days, needs: [north-metric] }
  - { id: product-tracking-plan, title: "Redacta el plan de medición de eventos", summary: "Lista qué eventos registrarás, con qué nombre y desde dónde. Al terminar todo tu equipo mide igual.", stage: before, category: product, kind: framework, duration: weeks }
  - { id: product-final-check, title: "Haz una revisión técnica final y prepara al equipo", summary: "Recorre el producto de principio a fin buscando fallos y aprovecha para que todo el equipo lo conozca. Al terminar nadie se sorprende el día del lanzamiento.", stage: before, category: product, kind: framework, duration: day }
  - { id: product-usability, title: "Haz pruebas de usabilidad con personas del perfil", summary: "Observa cómo usan el producto personas de tu cliente inicial, sin ayudarlas. Al terminar tienes una lista de fricciones por orden de gravedad.", stage: before, category: product, kind: guide, duration: days, needs: [customer-profile] }
  - { id: product-premortem, title: "Anticipa lo que puede salir mal en el lanzamiento", summary: "Imagina que el lanzamiento ha fallado, escribe por qué y prepara respuesta a las preguntas más probables. Al terminar tienes riesgos con responsable y una lista de preguntas frecuentes.", stage: before, category: product, kind: workshop, duration: hours, needs: [action-plan] }

  # Precio y modelo de negocio
  - { id: pricing-references, title: "Reúne las páginas de precios de tus alternativas", summary: "Guarda capturas de cómo cobran y empaquetan tus alternativas y anota lo que te llama la atención. Al terminar tienes una referencia para fijar tu precio.", stage: before, category: pricing, kind: framework, duration: day, needs: [competitor-map] }
  - { id: pricing-hypothesis, title: "Escribe por qué unidad cobrarás, como hipótesis a comprobar", summary: "Elige la unidad de cobro que crece con el valor que recibe el cliente y anótala como hipótesis. Al terminar sabes qué vas a poner a prueba.", stage: before, category: pricing, kind: decision, duration: hours, step: value-metric }
  - { id: pricing-willingness, title: "Investiga cuánto está dispuesto a pagar tu cliente", summary: "Pregunta o prueba precios con personas de tu segmento y compara lo que dicen con lo que hacen. Al terminar tu precio se apoya en algo más que una intuición.", stage: before, category: pricing, kind: analysis, duration: weeks, needs: [value-metric] }
  - { id: pricing-model, title: "Monta un primer modelo económico sencillo", summary: "Cruza precio, costes y número de clientes en una hoja simple. Al terminar sabes cuántos clientes necesitas para que las cuentas cuadren.", stage: before, category: pricing, kind: framework, duration: days, needs: [packages] }
  - { id: pricing-service-offers, title: "Empaqueta tus servicios en ofertas que puedas enseñar", summary: "Define qué incluye cada oferta de servicio, a quién va y cómo se cobra. Al terminar tienes ofertas claras.", stage: before, category: pricing, kind: decision, duration: days, needs: [value-metric] }
  - { id: pricing-workshop, title: "Fija con tu equipo la primera versión de precios", summary: "Reúne las referencias, lo que dicen los clientes y tus costes, y decide con ellos precio y paquetes. Al terminar hay una primera versión acordada.", stage: before, category: pricing, kind: workshop, duration: days, step: packages }
  - { id: pricing-review, title: "Programa una revisión periódica de tu precio", summary: "Pon en el calendario una fecha recurrente para revisar precio y paquetes con datos reales. Al terminar el precio deja de ser algo que se olvida.", stage: before, category: pricing, kind: habit, duration: hour }

  # Posicionamiento y mensaje
  - { id: positioning-initial, title: "Define tu posicionamiento inicial", summary: "Decide en qué categoría compites, frente a quién y por qué te elegirían. Al terminar tienes una frase de posicionamiento que cabe en una diapositiva.", stage: before, category: positioning, kind: workshop, duration: day, needs: [competitor-map, value-proposition] }
  - { id: positioning-differentiators, title: "Concreta lo que te diferencia de tus alternativas", summary: "Separa lo que todos ofrecen de lo que solo ofreces tú y escribe las razones únicas. Al terminar tus diferenciales se pueden demostrar.", stage: before, category: positioning, kind: decision, duration: day, step: differentiators }
  - { id: positioning-messaging, title: "Redacta tu mensaje base", summary: "Escribe la promesa y las razones que la sostienen en el idioma de tu cliente. Al terminar tienes el mensaje del que salen todos los demás.", stage: before, category: positioning, kind: framework, duration: days, step: core-message }
  - { id: positioning-visual-identity, title: "Define una identidad visual mínima", summary: "Elige nombre, colores, tipografía y un logotipo sencillo que sirvan para empezar. Al terminar tu marca se ve coherente en cualquier sitio.", stage: before, category: positioning, kind: workshop, duration: weeks }
  - { id: positioning-test, title: "Prueba tu mensaje y tu posicionamiento", summary: "Enséñalos a personas de tu cliente y mide si los entienden y si les interesan. Al terminar sabes qué palabras funcionan.", stage: before, category: positioning, kind: analysis, duration: month, needs: [core-message] }

  # Materiales
  - { id: materials-website, title: "Publica la primera versión de tu web", summary: "Monta una web sencilla con tu mensaje, una demostración y una forma de contactar. Al terminar tienes un sitio al que enviar a la gente.", stage: before, category: materials, kind: framework, duration: days, needs: [core-message] }
  - { id: materials-demo, title: "Graba una demostración del producto", summary: "Graba un recorrido corto que muestre el problema y cómo lo resuelves. Al terminar tienes un vídeo que enseñar sin estar presente.", stage: before, category: materials, kind: framework, duration: days }
  - { id: materials-press-kit, title: "Prepara un kit de prensa", summary: "Reúne logotipos, capturas, una descripción corta y datos de contacto en una carpeta. Al terminar quien quiera hablar de ti lo tiene todo a mano.", stage: before, category: materials, kind: framework, duration: day }
  - { id: materials-deck, title: "Deja lista la presentación que enseñas a terceros", summary: "Cuenta el problema, la solución, el mercado y lo que buscas en pocas diapositivas. Al terminar puedes enviarla sin retocarla cada vez.", stage: before, category: materials, kind: framework, duration: month, needs: [entry-segment, core-message] }
  - { id: materials-press-release, title: "Redacta una nota de prensa base", summary: "Escribe una nota que cuente la novedad con tu mensaje y que luego puedas adaptar. Al terminar tienes un texto listo para cada anuncio.", stage: before, category: materials, kind: framework, duration: weeks, needs: [core-message] }
  - { id: materials-legal, title: "Revisa tus términos, tu privacidad y tus cookies", summary: "Comprueba que tienes los textos legales y el aviso de cookies que tu web y tu producto necesitan, y consulta a un profesional si tienes dudas. Al terminar no lanzas sin ellos.", stage: before, category: materials, kind: guide, duration: day }

  # Canales y comunicación
  - { id: channels-engine, title: "Elige tu motor de crecimiento", summary: "Decide si creces por producto, por marketing o por ventas directas y por qué. Al terminar sabes por dónde empiezas.", stage: before, category: channels, kind: workshop, duration: hours, step: growth-engine }
  - { id: channels-choice, title: "Reduce los canales a los que sí tienen sentido", summary: "Puntúa los canales candidatos y quédate con los pocos que puedas atender bien. Al terminar concentras el esfuerzo donde hay más posibilidades.", stage: before, category: channels, kind: workshop, duration: hours, step: channel-choice }
  - { id: channels-funnel, title: "Esboza tu embudo y marca dónde te falta información", summary: "Dibuja las etapas del embudo y apunta las conversiones que tengas medidas; donde no haya dato, escribe «sin dato». Al terminar ves dónde falta información.", stage: before, category: channels, kind: workshop, duration: hours, needs: [channel-choice] }
  - { id: channels-first-posts, title: "Escribe tus primeras publicaciones para tener contenido que enseñar", summary: "Redacta un puñado de publicaciones útiles para tu cliente. Al terminar tu perfil ya aporta algo cuando alguien lo visita.", stage: before, category: channels, kind: quick, duration: hours, postin: true }
  - { id: channels-newsletter, title: "Abre un boletín o un espacio cerrado con novedades", summary: "Crea un lugar donde contar avances a quienes te siguen. Al terminar tienes un canal propio que no depende de una red.", stage: before, category: channels, kind: habit, duration: hours }
  - { id: channels-proof, title: "Recoge los primeros testimonios", summary: "Pide a las primeras personas que te han probado una frase sobre lo que han conseguido. Al terminar tienes prueba social con permiso para usarla.", stage: before, category: channels, kind: quick, duration: days }
  - { id: channels-marketplaces, title: "Decide si usarás plataformas externas para darte a conocer", summary: "Valora si te compensa lanzar en plataformas de terceros y qué ganas o pierdes. Al terminar sabes si entran en tu plan.", stage: before, category: channels, kind: decision, duration: month }
  - { id: channels-budget, title: "Prepara el presupuesto de tu GTM", summary: "Reparte el dinero y el tiempo entre canales y herramientas para el periodo del plan. Al terminar sabes cuánto puedes gastar en cada cosa.", stage: before, category: channels, kind: framework, duration: day }
  - { id: channels-launch-assets, title: "Revisa que cada acción del plan tiene su material y cuéntaselo a quien la ejecuta", summary: "Comprueba que cada acción cuenta con su material y presenta el plan a quien lo ejecuta. Al terminar todos saben cuál es su parte.", stage: before, category: channels, kind: framework, duration: day, needs: [action-plan] }

  # Lanzamiento
  - { id: launch-support, title: "Pide apoyo a tu círculo para el día del lanzamiento", summary: "Escribe a quienes quieren ayudarte con una petición concreta y un enlace. Al terminar tienes gente lista para compartir cuando salgas.", stage: launch, category: launch, kind: quick, duration: hours }
  - { id: launch-utm, title: "Etiqueta tus enlaces para saber de dónde viene cada visita", summary: "Usa un criterio fijo para etiquetar cada enlace que compartas. Al terminar sabes qué canal funciona.", stage: launch, category: launch, kind: habit, duration: hour }
  - { id: launch-email, title: "Envía el correo de lanzamiento", summary: "Redacta y envía el anuncio a tu lista, pensado para reutilizarlo en futuras novedades. Al terminar tu lista sabe que ya estás.", stage: launch, category: launch, kind: quick, duration: hours }
  - { id: launch-incidents, title: "Define un único canal para incidencias durante el lanzamiento", summary: "Elige dónde se reporta cualquier problema y quién responde. Al terminar nadie se entera por tres sitios distintos.", stage: launch, category: launch, kind: decision, duration: hour }
  - { id: launch-event, title: "Decide si harás un evento de lanzamiento", summary: "Valora si un evento, presencial o en línea, aporta lo suficiente para el esfuerzo que cuesta. Al terminar tienes una decisión con sus motivos.", stage: launch, category: launch, kind: decision, duration: weeks }
  - { id: launch-response, title: "Responde rápido a todo lo que llegue", summary: "Reparte turnos para contestar comentarios, mensajes y preguntas en cuanto lleguen. Al terminar nadie espera sin respuesta.", stage: launch, category: launch, kind: guide, duration: days }
  - { id: launch-evidence, title: "Guarda capturas y pruebas de todo lo que ocurra", summary: "Conserva mensajes, métricas y reacciones mientras suceden. Al terminar tienes material para casos de éxito y para aprender.", stage: launch, category: launch, kind: habit, duration: ongoing }

  # Sistema de trabajo
  - { id: system-retro, title: "Saca conclusiones del lanzamiento con los datos y con el equipo", summary: "Revisa con el equipo y con datos qué funcionó, qué no y qué cambiarías. Al terminar tienes decisiones para el siguiente ciclo.", stage: after, category: system, kind: analysis, duration: day }
  - { id: system-crm, title: "Ajusta tu primer CRM con lo que has visto", summary: "Adapta etapas y campos a cómo compran de verdad tus clientes. Al terminar tu CRM refleja tu proceso.", stage: after, category: system, kind: decision, duration: hours }
  - { id: system-motions-review, title: "Revisa tus motores de crecimiento con datos reales", summary: "Compara lo que esperabas de cada motor con lo que ha pasado y decide cuál refuerzas. Al terminar sabes en qué insistir.", stage: after, category: system, kind: analysis, duration: hours, needs: [growth-engine] }
  - { id: system-roadmap, title: "Calendariza las líneas de trabajo de tu GTM del año", summary: "Pon en un calendario las líneas de trabajo del año, con responsables y recursos. Al terminar sabes quién hace qué y cuándo.", stage: after, category: system, kind: framework, duration: hours, needs: [action-plan] }
  - { id: system-sprints, title: "Pon en marcha ciclos cortos de trabajo de crecimiento", summary: "Reúnete de forma recurrente para revisar métricas, decidir el foco y repartir acciones. Al terminar el ritmo del equipo no depende de una sola persona.", stage: after, category: system, kind: habit, duration: ongoing, needs: [plan-review] }
  - { id: system-experimentation, title: "Mejora cómo priorizas y registras tus experimentos", summary: "Revisa cómo se proponen, puntúan y cierran los experimentos y qué se aprende de cada uno. Al terminar cada experimento deja una decisión.", stage: after, category: system, kind: framework, duration: ongoing, needs: [experiments] }
  - { id: system-growth-loops, title: "Explora un bucle de crecimiento", summary: "Dibuja cómo el resultado de un cliente puede traer al siguiente y busca el primer paso a probar. Al terminar tienes un bucle sencillo para experimentar.", stage: after, category: system, kind: workshop, duration: weeks }
  - { id: system-sop, title: "Documenta un procedimiento estándar", summary: "Escribe paso a paso una tarea que se repite para que cualquiera la haga igual. Al terminar esa tarea no depende de una sola persona.", stage: after, category: system, kind: framework, duration: days }
  - { id: system-expansion, title: "Decide hacia dónde crecer después del primer lanzamiento", summary: "Valora nuevos canales, mercados o lanzamientos con lo aprendido y con tus límites. Al terminar tienes candidatos ordenados.", stage: after, category: system, kind: workshop, duration: month }

  # Marketing
  - { id: marketing-narrative, title: "Construye tu narrativa estratégica", summary: "Cuenta qué ha cambiado en el mundo, qué problema crea y cómo encaja tu producto. Al terminar tienes una historia que conecta con tu mensaje.", stage: after, category: marketing, kind: framework, duration: hours }
  - { id: marketing-content-strategy, title: "Decide de qué hablarás, en qué formato y cada cuánto en cada canal", summary: "Fija temas, formatos y ritmo para cada uno de tus canales principales. Al terminar el contenido responde a un plan.", stage: after, category: marketing, kind: framework, duration: day, needs: [core-message, channel-choice] }
  - { id: marketing-weekly, title: "Publica cada semana para preparar a tu audiencia", summary: "Mantén un ritmo regular de publicaciones útiles antes y después del lanzamiento. Al terminar tu audiencia ya te conoce cuando lanzas.", stage: after, category: marketing, kind: habit, duration: ongoing, postin: true }
  - { id: marketing-ai-writing, title: "Enseña a una IA a escribir como tú", summary: "Enséñale tu tono, tus ejemplos y tus normas para que sus borradores suenen a ti. Al terminar editas en lugar de escribir desde cero.", stage: after, category: marketing, kind: guide, duration: hours }
  - { id: marketing-lead-magnet, title: "Publica un recurso gratuito en LinkedIn para captar contactos", summary: "Crea un recurso útil para tu cliente y ofrécelo en una publicación a cambio de un correo. Al terminar tienes una vía de captación medible.", stage: after, category: marketing, kind: guide, duration: days, postin: true }
  - { id: marketing-social-selling, title: "Construye tu red en LinkedIn con personas de tu cliente y entabla conversaciones sin vender", summary: "Haz conexiones con sentido y mantén conversaciones útiles, sin vender de entrada. Al terminar tu red incluye a tu cliente.", stage: after, category: marketing, kind: habit, duration: ongoing }
  - { id: marketing-creators, title: "Valora si colaborar con creadores te ayudaría", summary: "Evalúa qué creadores llegan a tu cliente y qué pedirías a cambio. Al terminar decides si lo pruebas.", stage: after, category: marketing, kind: decision, duration: weeks }
  - { id: marketing-appearances, title: "Consigue entrevistas, charlas o apariciones", summary: "Propón temas a podcasts, eventos y medios donde esté tu cliente. Al terminar tienes apariciones que sirven de prueba social.", stage: after, category: marketing, kind: campaign, duration: days }
  - { id: marketing-email-sequences, title: "Prepara las secuencias de correo básicas", summary: "Escribe la bienvenida y el seguimiento para quien se apunte. Al terminar nadie se queda sin respuesta.", stage: after, category: marketing, kind: campaign, duration: weeks }
  - { id: marketing-paid, title: "Refuerza tu captación con publicidad de pago", summary: "Prueba anuncios con un presupuesto limitado para ampliar lo que ya funciona de forma orgánica. Al terminar sabes cuánto cuesta conseguir un interesado.", stage: after, category: marketing, kind: campaign, duration: month }
  - { id: marketing-community, title: "Crea una comunidad o aporta en una ajena", summary: "Decide si montas tu propio espacio o participas en uno existente, y define cómo aportar valor. Al terminar tienes un sitio donde tu cliente te encuentra.", stage: after, category: marketing, kind: habit, duration: month }

  # Ventas
  - { id: sales-deck, title: "Prepara la presentación de ventas", summary: "Estructura la presentación para una reunión comercial, desde el problema del cliente hasta el siguiente paso. Al terminar la usas sin improvisar.", stage: after, category: sales, kind: framework, duration: weeks }
  - { id: sales-one-pager, title: "Resume tu oferta en una hoja", summary: "Condensa el problema, tu solución y la prueba en una hoja que se pueda reenviar. Al terminar tienes material para dejar tras una reunión.", stage: after, category: sales, kind: framework, duration: day }
  - { id: sales-case-studies, title: "Escribe casos de éxito con clientes que den permiso", summary: "Cuenta la situación inicial, qué se hizo y qué cambió, con el permiso del cliente. Al terminar tienes prueba para tus próximas ventas.", stage: after, category: sales, kind: framework, duration: weeks }
  - { id: sales-outbound, title: "Lanza una campaña de contacto directo", summary: "Define a quién escribes, con qué mensaje y qué haces con cada respuesta. Al terminar tienes un flujo de contacto repetible.", stage: after, category: sales, kind: campaign, duration: month, needs: [core-message, customer-profile] }
  - { id: sales-partners, title: "Diseña un primer programa de alianzas", summary: "Define qué aporta cada socio, qué recibe y cómo se mide. Al terminar tienes una propuesta para presentar a los primeros socios.", stage: after, category: sales, kind: campaign, duration: month }
  - { id: sales-target-list, title: "Define los criterios de tu lista de clientes ideales", summary: "Fija qué cuentas encajan y cómo ampliarlas con perfiles parecidos; la lista de contactos vive fuera de GTM Lab. Al terminar sabes a quién buscar.", stage: after, category: sales, kind: guide, duration: day, needs: [customer-profile] }
  - { id: sales-video, title: "Prueba mensajes en vídeo en un punto de tu proceso comercial", summary: "Usa mensajes grabados en lugar de texto en una parte del proceso. Al terminar decides si compensa.", stage: after, category: sales, kind: campaign, duration: day }
  - { id: sales-abm, title: "Diseña un programa de marketing por cuentas", summary: "Elige unas pocas cuentas y planea acciones a medida para cada rol del comité de compra. Al terminar tienes un plan por cuenta.", stage: after, category: sales, kind: campaign, duration: month, needs: [customer-profile, buying-group] }
  - { id: sales-call-script, title: "Escribe el guion de tu llamada de ventas", summary: "Prepara las preguntas, la forma de presentar tu producto y cómo cerrar la llamada. Al terminar sabes qué buscas en cada conversación.", stage: after, category: sales, kind: campaign, duration: hours, needs: [core-message] }
  - { id: sales-exit, title: "Pregunta a quienes se van con entrevistas o encuestas de salida", summary: "Averigua por qué dejan el producto o no compran y qué les hizo dudar. Al terminar sabes qué corregir.", stage: after, category: sales, kind: campaign, duration: hours }
