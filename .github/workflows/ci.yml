name: CI

# Checks every commit that reaches main, whoever wrote it, and every pull request.
# Lint is left out on purpose: the repo carries formatting debt and the gate lints the files each change touches.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Production build
        run: npx vite build
